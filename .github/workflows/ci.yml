name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The JVM build does not compile the Go module, so a break there is invisible to
  # ./gradlew build. This job is the only thing that catches it.
  go:
    name: Go parser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: parser/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.33.0

      # go.pb.go is gitignored, so it must be generated before anything compiles.
      - name: Generate protobuf bindings
        run: protoc --go_out=. --go_opt=paths=source_relative proto/go.proto

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  jvm:
    name: Java recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

  # Both build systems compile the same sources and must stay in step.
  maven:
    name: Maven build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Test
        run: mvn -B test
